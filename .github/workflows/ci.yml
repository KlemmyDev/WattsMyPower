# The same checks CONTRIBUTING.md asks for before a pull request, run on every pull request, every merge to main
# and every release tag. Actions are pinned to a commit (the version beside it) so a moved tag can't change what runs.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # The Version workflow starts it on the commit moving the version to today (its push can't start it).
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run; runs on main and tags always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The dev group includes the collector's extra, so both services are checked.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: Dashboard (typecheck, lint, format, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24" # as the Docker image builds it (package.json needs 22 or later)
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  docker:
    name: Docker image (${{ matrix.platform }})
    # Each platform builds on its own kind of machine (GitHub's Arm runners are free for public repositories), so
    # arm64, for a Raspberry Pi, is checked on every pull request without the slow emulation QEMU would need.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Both images docker-compose.yml builds, built and thrown away (nothing is pushed anywhere).
      - name: Build the collector
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: collector
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha,scope=collector-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=collector-${{ matrix.platform }}
      - name: Build the dashboard
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          platforms: ${{ matrix.platform }}
          push: false
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=api-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.platform }}
