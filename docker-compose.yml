services:
  # Reads the inverters every poll and stores the raw registers. Rarely changes, so it keeps
  # recording through dashboard updates. See collector/PROTOCOL.md.
  collector:
    build:
      context: .
      target: collector
    container_name: wattsmypower-collector
    restart: unless-stopped
    # The dashboard reaches it inside Docker; it's published on this machine only (127.0.0.1), as it can
    # also connect and remove inverters. For a dashboard running elsewhere (e.g. while developing) to
    # follow it, set COLLECTOR_BIND=0.0.0.0; the feed needs COLLECTOR_TOKEN. COLLECTOR_PORT changes the port.
    ports:
      - "${COLLECTOR_BIND:-127.0.0.1}:${COLLECTOR_PORT:-8081}:8081"
    volumes:
      - ./data:/data
    environment:
      # The inverters are connected in the dashboard (Settings → Integrations) and stored in
      # data/collector.db. These only move an older install's inverters into it, the first time.
      INVERTER_DRIVER: ${INVERTER_DRIVER:-sungrow.sh_rs}
      INVERTER_HOST: ${INVERTER_HOST:-}
      INVERTER_PORT: ${INVERTER_PORT:-502}
      INVERTER_UNIT: ${INVERTER_UNIT:-1}
      PV2_DRIVER: ${PV2_DRIVER:-sungrow.sg_d}
      PV2_HOST: ${PV2_HOST:-}
      PV2_PORT: ${PV2_PORT:-502}
      PV2_UNIT: ${PV2_UNIT:-1}
      PV2_BEHIND_METER: ${PV2_BEHIND_METER:-true}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      COLLECTOR_RETENTION_DAYS: ${COLLECTOR_RETENTION_DAYS:-365}
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?COLLECTOR_TOKEN is not set; run bash install.sh}
      # Inverters connected in the dashboard must be on the local network unless this is true.
      COLLECTOR_ALLOW_PUBLIC_HOSTS: ${COLLECTOR_ALLOW_PUBLIC_HOSTS:-false}
      # Where days roll over. Unset, it's Brisbane, and the log says to set it (TZ_CHOSEN: docker-entrypoint.sh).
      TZ: ${TZ:-Australia/Brisbane}
      TZ_CHOSEN: ${TZ:-}
    # Logs are kept to 3 files of 10 MB (an SD card in a Raspberry Pi wears out with endless writing).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The dashboard and its API: turns the collector's raw registers into readings, costs and insights.
  wattsmypower:
    build:
      context: .
      target: api
      args:
        # The commit it's built from (install.sh sets it), so Settings → System can tell when there's a newer one.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: wattsmypower
    restart: unless-stopped
    # Started once the collector answers (its healthcheck, in the Dockerfile).
    depends_on:
      collector:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data:/data
      # This machine's Bluetooth (portable batteries, Teslas) is added by docker-compose.bluetooth.yml, which
      # install.sh turns on when it finds an adapter with BlueZ running.
    environment:
      COLLECTOR_URL: http://collector:8081
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?COLLECTOR_TOKEN is not set; run bash install.sh}
      COLLECTOR_WRITES: ${COLLECTOR_WRITES:-true}
      # Loggers to turn up to DEBUG, comma-separated (tesla_fleet_api, bleak_retry_connector, bleak): what the car
      # says over Bluetooth, message by message, when a read fails and the INFO log doesn't say why.
      LOG_DEBUG: ${LOG_DEBUG:-}
      PV2_BEHIND_METER: ${PV2_BEHIND_METER:-true}
      POLL_INTERVAL: ${POLL_INTERVAL:-60}
      RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS:-90}
      TZ: ${TZ:-Australia/Brisbane}
      TZ_CHOSEN: ${TZ:-}
      # Set in the dashboard (Settings → System) and stored in data/wattsmypower.db. These only move
      # an older install's values into it, the first time.
      PV_KW: ${PV_KW:-6.6}
      BATTERY_KWH: ${BATTERY_KWH:-0}
      IMPORT_RATE: ${IMPORT_RATE:-0.32}
      FEED_IN_RATE: ${FEED_IN_RATE:-0.05}
      SUPPLY_CHARGE: ${SUPPLY_CHARGE:-1.05}
      LATITUDE: ${LATITUDE:--27.47}
      LONGITUDE: ${LONGITUDE:-153.03}
      AUTH: ${AUTH:-true}
      # Behind a reverse proxy: its address, so sign-in sees each browser's address rather than the proxy's.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      API_DOCS: ${API_DOCS:-false}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
