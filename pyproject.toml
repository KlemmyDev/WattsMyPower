[project]
name = "wattsmypower"
# The date it was released (a second release that day adds .1, .2…).
version = "2026.10.9"
description = "Local-first, self-hosted home energy dashboard: Sungrow solar and battery, the grid, EVs and smart-home devices, live and on your own network"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    # FastAPI's web layer; at least the release that fixes its known security advisories.
    "starlette>=1.3.1",
    "uvicorn[standard]==0.39.0",
    # The collector's encrypted dongles, and the dashboard's browser notifications (Web Push).
    "pycryptodomex==3.23.0",
    # Portable batteries (Bluetti) read over Bluetooth.
    "bleak==3.0.2",
    "tesla-fleet-api==1.17.3",
]

[project.optional-dependencies]
# Only the collector (python -m collector) talks to the inverters.
collector = [
    "pymodbus==3.8.6",
]

[dependency-groups]
dev = [
    "wattsmypower[collector]",  # so the collector's tests and type checks run in the dev environment
    "httpx>=0.28",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.wattsmypower]
# How far along it is (e.g. "alpha"), shown beside the version in Manage → System → Updates. Left out once it's
# stable; the navigation shows the release channel an install follows instead (Nightly, Beta).

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # long lines: the formatter handles what it can; long SQL and messages stay readable
    "RUF001",  # ambiguous unicode: user-facing copy uses en dashes and minus signs on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "collector"]

[tool.mypy]
python_version = "3.13"
packages = ["app", "collector"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["pymodbus.*", "Cryptodome.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",  # inside Starlette's TestClient
]
